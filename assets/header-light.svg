<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#0891b2" stop-opacity="0.35"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0891b2"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0f172a" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    @keyframes driftA { 0%,100% { transform: translate(0px,0px) } 50% { transform: translate(60px,30px) } }
    @keyframes driftB { 0%,100% { transform: translate(0px,0px) } 50% { transform: translate(-50px,-25px) } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    .a { animation: driftA 14s ease-in-out infinite }
    .b { animation: driftB 11s ease-in-out infinite }
    .r1 { animation: rise .8s ease-out both }
    .r2 { animation: rise .8s ease-out .25s both }
    .r3 { animation: rise .8s ease-out .5s both }
    .r4 { animation: rise .8s ease-out .75s both }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="a" cx="260" cy="40" r="260" fill="url(#orbA)"/>
    <circle class="b" cx="1000" cy="300" r="240" fill="url(#orbB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#d0d7de"/>

  <g class="r1"><text x="64" y="92" font-size="16" font-weight="700" fill="#57606a" letter-spacing="3">HI THERE, I'M</text></g>
  <g class="r2"><text x="62" y="160" font-size="66" font-weight="800" fill="#1f2328">Nishant Sharma</text></g>
  <g class="r3"><text x="64" y="206" font-size="30" font-weight="700" fill="url(#shine)">AI &amp; Full-Stack Developer</text>
    <text x="64" y="236" font-size="17" fill="#57606a">B.Tech @ Faculty of Technology, University of Delhi · Noida, India</text></g>
  <g class="r4"><rect x="64" y="252" width="104" height="30" rx="15" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/><text x="116" y="272" font-size="14" font-weight="600" fill="#0891b2" text-anchor="middle">AI Agents</text><rect x="177.60000000000002" y="252" width="112" height="30" rx="15" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/><text x="234" y="272" font-size="14" font-weight="600" fill="#0891b2" text-anchor="middle">Full-Stack</text><rect x="299.6" y="252" width="112" height="30" rx="15" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/><text x="356" y="272" font-size="14" font-weight="600" fill="#0891b2" text-anchor="middle">Hackathons</text><rect x="421.6" y="252" width="120" height="30" rx="15" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/><text x="482" y="272" font-size="14" font-weight="600" fill="#0891b2" text-anchor="middle">Open Source</text></g>

  <g transform="translate(985 160)">
    <circle r="112" fill="none" stroke="#0891b2" stroke-opacity="0.35" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle r="84" fill="none" stroke="#7c3aed" stroke-opacity="0.5"/>
      <circle cx="84" cy="0" r="7" fill="#7c3aed"/><circle cx="-84" cy="0" r="4" fill="#0891b2"/>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      <circle r="56" fill="none" stroke="#0891b2" stroke-opacity="0.6"/>
      <circle cx="0" cy="-56" r="6" fill="#b45309"/>
    </g>
    <circle r="38" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <text y="10" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#0891b2" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
