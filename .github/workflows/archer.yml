name: Contribution hunt

on:
  schedule:
    - cron: "17 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/archer.py
      - .github/workflows/archer.yml

permissions:
  contents: write

concurrency:
  group: archer
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Draw the archer
        run: python3 scripts/archer.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contribution hunt"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
