name: Flight log

on:
  schedule:
    - cron: "17 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/airport.py
      - .github/workflows/airport.yml

permissions:
  contents: write

concurrency:
  group: airport
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update the boards
        run: python3 scripts/airport.py --user "${{ github.repository_owner }}"

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/airport
          git diff --cached --quiet || { git commit -q -m "Refresh flight log"; git push -q; }
